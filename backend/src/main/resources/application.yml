server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lowkey-cafe-restaurant
  profiles:
    active: local
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Default: Local profile with file-based permanent persistent H2 database
  datasource:
    url: jdbc:h2:file:./data/lowkeycafe;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:lowkeycafe.receipts@gmail.com}
    password: ${MAIL_PASSWORD:mock_smtp_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_LowkeyCafe2026}
    key-secret: ${RAZORPAY_KEY_SECRET:dummy_razorpay_secret_key_lowkey}
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
  restaurant:
    name: "Lowkey Cafe"
    tagline: "Artisan Coffee, Gourmet Bites & Good Vibes"
    address: "742 Evergreen Terrace, Foodie Lane, Metro City"
    phone: "+91 98765 43210"
    email: "contact@lowkeycafe.com"
    wifi-name: "LowkeyCafe_Guest_5G"
    wifi-password: "espresso_vibes"
    currency: "INR"
    currency-symbol: "₹"
    tax-percentage: 5.0
    service-charge-percentage: 5.0
    points-per-hundred-spent: 10
    point-redemption-value: 1.0 # 1 point = 1 rupee discount
